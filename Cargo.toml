[package]
name = "yvdb"
version = "0.1.4"
description = "Educational in-memory vector DB: WAL + bincode snapshots (TOON header), IVF bucket search, Axum REST API, TOON query responses"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thegreatbey/yvdb"
documentation = "https://docs.rs/yvdb"
readme = "README.md"
keywords = ["vector-database", "TOON", "rag", "embedding", "ivf"]
categories = ["database", "database-implementations", "command-line-utilities"]
edition = "2021"

[package.metadata.docs.rs]
all-features = true

[dependencies]
axum = { version = "0.7", features = ["macros", "http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
#bincode: compact binary snapshots (used with TOON magic header in persist/snapshot.rs)
bincode = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1"
tower = { version = "0.5", features = ["timeout"] }

 

[dev-dependencies]
# tower provides ServiceExt::oneshot for testing routers without binding sockets
tower = { version = "0.5", features = ["util"] }
# collects HTTP response bodies in tests
http-body-util = "0.1"
# temporary files/directories for isolated WAL paths
tempfile = "3"

[lib]
name = "yvdb"
path = "src/lib.rs"

[workspace]
 #breaks current link with parent dir

