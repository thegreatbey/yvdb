[package]
name = "yvdb"
version = "0.1.0"
description = "Small educational in-memory vector database with REST API, append-only durability, brute-force search, and adaptive heartbeat feat for RAG hallucination mitigation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thegreatbey/yvdb"
readme = "README.md"
keywords = ["vector-database", "educational", "rag", "embedding", "rust"]
categories = ["database", "database-implementations", "command-line-utilities", "machine-learning", "development-tools"]
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["macros", "http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
anyhow = "1"
tower = { version = "0.5", features = ["timeout"] }

 

[dev-dependencies]
# tower provides ServiceExt::oneshot for testing routers without binding sockets
tower = { version = "0.5", features = ["util"] }
# collects HTTP response bodies in tests
http-body-util = "0.1"
# temporary files/directories for isolated WAL paths
tempfile = "3"

 

